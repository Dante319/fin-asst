<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}fin-asst{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    /* Read the saved theme before first paint so a dark-mode reload never
       flashes white. Wrapped because localStorage throws in some privacy
       modes, and a theme preference is not worth a broken page. */
    try {
      var t = localStorage.getItem('finasst-theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="mark" aria-hidden="true"></span>fin&#8209;asst</a>
  <nav>
    <a href="/" class="{{ 'active' if page == 'dashboard' }}">Dashboard</a>
    <a href="/transactions" class="{{ 'active' if page == 'transactions' }}">Transactions</a>
    <a href="/remittances" class="{{ 'active' if page == 'remittances' }}">Remittances</a>
    <a href="/income" class="{{ 'active' if page == 'income' }}">Income</a>
    <a href="/goals" class="{{ 'active' if page == 'goals' }}">Goals</a>
    <a href="/import" class="{{ 'active' if page == 'import' }}">Import</a>
  </nav>
  <div class="topbar-end">
    <span class="local-note" title="This server binds to 127.0.0.1 and talks to nothing else.">local only</span>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark">
      <span class="sun" aria-hidden="true">&#9728;</span><span class="moon" aria-hidden="true">&#9789;</span>
    </button>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body>
</html>
