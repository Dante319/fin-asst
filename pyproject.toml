[project]
name = "fin-asst"
version = "0.1.0"
description = "A private, local-first personal finance assistant: CSV import, spend categorization, and goal projections."
requires-python = ">=3.10"

[project.scripts]
finasst = "finasst.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
