[project]
name = "fin-asst"
version = "0.1.0"
description = "A private, local-first personal finance assistant: CSV import, spend categorization, and goal projections."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
finasst = "finasst.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Only for TestClient in tests/test_web.py. Not a runtime dependency: the
    # app itself still reaches the network exactly once, when you press the
    # button that fetches reference rates.
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finasst"]
